<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="shortcut icon" type="image/x-icon" href="0c3d410f3f40eeced3e3eca7af7d8df6.ico">
    <title>小酷搜索</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #eef1fb 0%, #f5f7ff 100%);
        }

        /* 左上角小酷按钮 */
        .brand-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #4e6ef2, #7c5cff);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 14px rgba(78, 110, 242, 0.35);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .brand-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(78, 110, 242, 0.45);
            background: linear-gradient(135deg, #3b5bdb, #6a48f0);
        }

        .brand-btn:active {
            transform: scale(0.97);
        }

        .brand-btn .logo {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #fff;
            color: #4e6ef2;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 800;
        }

        .search-wrapper {
            display: flex;
            box-shadow: 0 8px 30px rgba(78, 110, 242, 0.15);
            border-radius: 26px;
            overflow: hidden;
            background: #fff;
        }

        .search-input {
            width: 440px;
            height: 52px;
            padding: 0 18px;
            border: 2px solid #e4e7f5;
            border-right: none;
            border-radius: 26px 0 0 26px;
            outline: none;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fafbff;
        }

        .search-input:focus {
            border-color: #4e6ef2;
            background: #fff;
            box-shadow: inset 0 0 0 3px rgba(78, 110, 242, 0.12);
        }

        .search-btn {
            width: 116px;
            height: 52px;
            border: none;
            background: linear-gradient(135deg, #4e6ef2, #3b5bdb);
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: linear-gradient(135deg, #3b5bdb, #2f4ccc);
        }

        .search-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <a class="brand-btn" href="https://xiaoku1818.pages.dev/" target="_blank" rel="noopener noreferrer">
        <span class="logo">酷</span>
        <span>小酷</span>
    </a>

    <form class="search-wrapper" onsubmit="return doSearch()">
        <input
            id="kw"
            class="search-input"
            type="text"
            placeholder="请输入搜索内容"
            autocomplete="off"
        >
        <button class="search-btn" type="submit">小酷一下</button>
    </form>

    <script>
        function doSearch() {
            const keyword = document.getElementById("kw").value.trim();
            if (!keyword) {
                document.getElementById("kw").focus();
                return false;
            }
            window.open("https://www.baidu.com/s?wd=" + encodeURIComponent(keyword), "_blank");
            return false;
        }
    </script>

</body>
</html>
