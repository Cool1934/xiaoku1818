<script>
/* 动态生成飘落彩纸 */
const colors = ['#e60012', '#ff8a00', '#ffe28a', '#ffccd5'];
for (let i = 0; i < 18; i++) {
  const p = document.createElement('div');
  p.className = 'petal';
  p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
  p.style.left = Math.random() * 100 + 'vw';
  p.style.animationDuration = (6 + Math.random() * 8) + 's';
  p.style.animationDelay = (Math.random() * 10) + 's';
  document.body.appendChild(p);
}

/* 图片预览弹窗 */
const modal = document.getElementById('imgModal');
const modalImg = document.getElementById('modalImg');
const imgs = document.querySelectorAll('.preview-img');
let currentIndex = 0;
imgs.forEach((img, i) => {
  img.onclick = () => {
    currentIndex = i;
    modal.style.display = 'flex';
    modalImg.src = img.src;
  };
});
document.getElementById('modalClose').onclick = () => modal.style.display = 'none';
document.getElementById('modalPrev').onclick = () => {
  currentIndex = (currentIndex - 1 + imgs.length) % imgs.length;
  modalImg.src = imgs[currentIndex].src;
};
document.getElementById('modalNext').onclick = () => {
  currentIndex = (currentIndex + 1) % imgs.length;
  modalImg.src = imgs[currentIndex].src;
};
modal.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
</script>
