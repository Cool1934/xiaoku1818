<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>声屿语聊 - 让声音连接你我</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }

        .container {
            text-align: center;
            padding: 40px 20px;
        }

        .logo {
            width: 120px;
            height: 120px;
            border-radius: 28px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 52px;
            margin: 0 auto 24px;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4);
        }

        h1 {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 2px;
        }

        .slogan {
            font-size: 18px;
            opacity: 0.75;
            margin-bottom: 48px;
            font-weight: 300;
        }

        .download-section {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .download-btn {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 36px;
            border-radius: 16px;
            text-decoration: none;
            color: #fff;
            font-size: 17px;
            font-weight: 600;
            transition: all 0.3s ease;
            min-width: 220px;
            justify-content: center;
            cursor: pointer;
        }

        .download-btn.android {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            box-shadow: 0 10px 30px rgba(67, 233, 123, 0.3);
        }

        .download-btn.android:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 40px rgba(67, 233, 123, 0.45);
        }

        .download-btn.windows {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .download-btn.windows:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        .coming-soon-tag {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.15);
            padding: 2px 8px;
            border-radius: 20px;
            margin-left: 6px;
            font-weight: 400;
        }

        .download-btn .icon {
            font-size: 26px;
        }

        .footer {
            margin-top: 60px;
            opacity: 0.4;
            font-size: 13px;
        }

        @media (max-width: 500px) {
            h1 { font-size: 32px; }
            .download-btn { min-width: 180px; padding: 16px 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🏝️</div>

        <h1>声屿语聊</h1>
        <p class="slogan">让每一次对话，都有回响</p>

        <div class="download-section">
            <a class="download-btn android" href="shengyu.apk">
                <span class="icon">🤖</span>
                <span>下载 Android 版</span>
            </a>
            <div class="download-btn windows">
                <span class="icon">🪟</span>
                <span>Windows</span>
                <span class="coming-soon-tag">即将上线</span>
            </div>
        </div>

        <div class="footer">
            © 2026 声屿语聊 · All rights reserved
        </div>
    </div>
</body>
</html>
