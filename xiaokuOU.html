<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>xiaoku OU</title>
<style>
  :root{
    --bg1:#0f2027; --bg2:#203a43; --bg3:#2c5364;
    --icon:54px; --gap:18px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,var(--bg1),var(--bg2),var(--bg3));
    background-attachment:fixed;
    color:#fff;
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }

  #desktop{
    position:fixed; inset:0;
    padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 20px);
    overflow-y:auto; overflow-x:hidden;
    display:flex; flex-direction:column;
  }

  #topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:2px 6px 14px; flex:none;
    gap:8px;
  }
  #clock-wrap{ flex:none; }
  #clock{ font-size:30px; font-weight:600; letter-spacing:.5px; line-height:1; }
  #date{ font-size:12px; opacity:.85; margin-top:4px; }
  body[data-hasbg="1"] #clock,
  body[data-hasbg="1"] #date{ text-shadow:0 1px 6px rgba(0,0,0,.6); }

  #searchWrap{
    flex:1; max-width:180px; position:relative;
  }
  #searchInput{
    width:100%; height:36px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.25);
    color:#fff; font-size:13px;
    padding:0 30px 0 12px; border-radius:18px;
    backdrop-filter:blur(6px);
    -webkit-appearance:none; outline:none;
  }
  #searchInput::placeholder{ color:rgba(255,255,255,.6); }
  #searchClear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:20px; height:20px; border-radius:50%;
    background:rgba(255,255,255,.3); color:#fff; border:none;
    font-size:14px; cursor:pointer; display:none;
    align-items:center; justify-content:center;
  }
  #searchClear.show{ display:flex; }
  #searchEmpty{
    display:none; text-align:center; padding:40px 20px;
    color:rgba(255,255,255,.6); font-size:14px;
  }
  #searchEmpty.show{ display:block; }

  #settingsBtn{
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.25);
    color:#fff; font-size:13px;
    padding:8px 14px; border-radius:18px;
    cursor:pointer; white-space:nowrap;
    backdrop-filter:blur(6px);
  }
  #settingsBtn:active{ background:rgba(255,255,255,.3); }

  #settingsModal{
    position:fixed; inset:0; z-index:110;
    background:rgba(0,0,0,.5);
    display:none; align-items:flex-end; justify-content:center;
    backdrop-filter:blur(2px);
  }
  #settingsModal.show{ display:flex; }
  .sheet.tall{ max-height:78vh; overflow-y:auto; }
  .tabs{ display:flex; gap:6px; margin-bottom:16px; }
  .tabs button{
    flex:1; padding:9px; border:1px solid #d1d1d6; background:#f2f2f7;
    border-radius:10px; font-size:13px; cursor:pointer; color:#1c1c1e;
  }
  .tabs button.active{ background:#007aff; color:#fff; border-color:#007aff; }
  .tab-panel{ display:none; }
  .tab-panel.active{ display:block; }
  .preset-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
  .preset{
    aspect-ratio:16/10; border-radius:10px; cursor:pointer;
    background-size:cover; background-position:center;
    border:2px solid transparent;
  }
  .preset.active{ border-color:#007aff; }
  .upload-btn{
    display:block; text-align:center; padding:12px; margin-bottom:16px;
    background:#f2f2f7; border-radius:12px; font-size:14px; cursor:pointer; color:#007aff;
  }
  .hint{ font-size:11px; color:#8e8e93; text-align:center; margin-top:6px; }
  .reset-btn{ width:100%; padding:12px; margin-top:6px; border:1px solid #ff3b30; background:#fff; color:#ff3b30; border-radius:12px; font-size:14px; cursor:pointer; }
  .size-options{ display:flex; gap:8px; margin-bottom:16px; }
  .size-options button{
    flex:1; padding:10px; border:1px solid #d1d1d6; background:#f2f2f7;
    border-radius:10px; font-size:13px; cursor:pointer; color:#1c1c1e;
  }
  .size-options button.active{ background:#007aff; color:#fff; border-color:#007aff; }
  .about{ font-size:13px; color:#6e6e73; line-height:1.7; }
  .about b{ color:#1c1c1e; }

  #grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(76px,1fr));
    gap:var(--gap) 10px;
    align-content:start;
    padding-bottom:20px;
  }
  .app{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    position:relative;
    touch-action:none;
  }
  .app .icon{
    width:var(--icon); height:var(--icon);
    border-radius:14px;
    background:rgba(255,255,255,.15);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
    pointer-events:none;
  }
  .app .icon img{ width:100%; height:100%; object-fit:cover; display:block; }
  .app .name{
    font-size:11px; text-align:center; line-height:1.2;
    max-width:74px; word-break:break-all;
    text-shadow:0 1px 3px rgba(0,0,0,.4);
  }
  .app .del{
    position:absolute; top:-6px; right:-6px;
    width:22px; height:22px; border-radius:50%;
    background:#ff3b30; color:#fff; border:none;
    font-size:16px; line-height:1; cursor:pointer;
    display:none; align-items:center; justify-content:center;
    box-shadow:0 2px 6px rgba(0,0,0,.3);
    z-index:10;
    pointer-events:auto;
  }
  body.edit .app .del{ display:flex; }
  body.edit .app .icon{ pointer-events:none; }
  .app.dragging{ opacity:.4; }
  .app .icon.over{ outline:2px solid #fff; }

  .add-app .icon{
    background:rgba(255,255,255,.18);
    border:2px dashed rgba(255,255,255,.7);
    box-shadow:none;
  }
  .add-app .icon span{ font-size:30px; line-height:1; }
  .add-app:active .icon{ background:rgba(255,255,255,.32); }

  #modal{
    position:fixed; inset:0; z-index:100;
    background:rgba(0,0,0,.5);
    display:none; align-items:flex-end; justify-content:center;
    backdrop-filter:blur(2px);
  }
  #modal.show{ display:flex; }
  .sheet{
    width:100%; max-width:480px;
    background:#fff; color:#1c1c1e;
    border-radius:18px 18px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));
    animation:slideUp .25s ease;
  }
  @keyframes slideUp{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
  .sheet h3{ margin:0 0 4px; font-size:18px; }
  .sheet .sub{ margin:0 0 16px; font-size:12px; color:#8e8e93; }
  .field label{ display:block; font-size:12px; color:#6e6e73; margin-bottom:6px; }
  .field input{
    width:100%; box-sizing:border-box;
    border:1px solid #d1d1d6; border-radius:12px;
    padding:12px 14px; font-size:15px; margin-bottom:14px;
    -webkit-appearance:none;
  }
  /* 自定义名称实时预览 */
  #namePreview{
    font-size:12px; color:#8e8e93; margin:-8px 0 14px; min-height:16px;
  }
  #namePreview b{ color:#007aff; }
  /* 自定义图标上传 */
  .custom-icon-row{
    display:flex; align-items:center; gap:10px; margin-bottom:14px;
  }
  .custom-icon-btn{
    flex:none; padding:8px 14px;
    background:#f2f2f7; border:1px solid #d1d1d6; border-radius:10px;
    font-size:13px; color:#007aff; cursor:pointer; white-space:nowrap;
  }
  .custom-icon-btn:active{ background:#e5e5ea; }
  .custom-icon-preview{
    width:36px; height:36px; border-radius:8px; overflow:hidden;
    background:#e5e5ea; flex:none; display:none;
  }
  .custom-icon-preview.show{ display:block; }
  .custom-icon-preview img{ width:100%; height:100%; object-fit:cover; }
  .custom-icon-clear{
    width:22px; height:22px; border-radius:50%;
    background:#ff3b30; color:#fff; border:none;
    font-size:13px; cursor:pointer; display:none;
    align-items:center; justify-content:center; flex:none;
  }
  .custom-icon-clear.show{ display:flex; }
  .custom-icon-hint{ font-size:11px; color:#8e8e93; flex:1; }
  .btns{ display:flex; gap:10px; }
  .btns button{
    flex:1; padding:13px; border:none; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer;
  }
  #addOk{ background:#007aff; color:#fff; }
  #addCancel{ background:#f2f2f7; color:#1c1c1e; }
</style>
</head>
<body>
<div id="desktop">
  <div id="topbar">
    <div id="clock-wrap">
      <div id="clock">00:00</div>
      <div id="date"></div>
    </div>
    <div id="searchWrap">
      <input id="searchInput" type="text" placeholder="搜索应用" autocomplete="off" spellcheck="false">
      <button id="searchClear">×</button>
    </div>
    <button id="settingsBtn">设置</button>
  </div>
  <div id="searchEmpty"></div>
  <div id="grid"></div>
</div>

<!-- 添加链接弹窗 -->
<div id="modal">
  <div class="sheet">
    <h3>添加网页到桌面</h3>
    <p class="sub">输入任意网站链接，即可在桌面生成快捷方式</p>
    <div class="field">
      <label>网站链接</label>
      <input id="urlInput" type="url" placeholder="https://xiaoku1818.pages.dev/" autocomplete="off" spellcheck="false">
    </div>
    <!-- 自定义名称 -->
    <div class="field">
      <label>自定义名称（可选）</label>
      <input id="nameInput" type="text" placeholder="留空则自动识别网站名" autocomplete="off" maxlength="20">
    </div>
    <div id="namePreview"></div>
    <!-- 自定义图标 -->
    <div class="field">
      <label>自定义图标（可选）</label>
      <div class="custom-icon-row">
        <label class="custom-icon-btn" for="iconUpload">选择图片</label>
        <input id="iconUpload" type="file" accept="image/*" style="display:none">
        <div class="custom-icon-preview" id="iconPreview"><img id="iconPreviewImg"></div>
        <button class="custom-icon-clear" id="iconClear">×</button>
        <span class="custom-icon-hint">不上传则自动获取网站图标</span>
      </div>
    </div>
    <div class="btns">
      <button id="addCancel">取消</button>
      <button id="addOk">添加</button>
    </div>
  </div>
</div>

<!-- 设置弹窗 -->
<div id="settingsModal">
  <div class="sheet tall">
    <div class="tabs">
      <button data-tab="bg" class="active">背景</button>
      <button data-tab="desktop">桌面</button>
      <button data-tab="about">关于</button>
    </div>
    <div class="tab-panel active" id="panel-bg">
      <div class="field"><label>预设壁纸</label></div>
      <div class="preset-grid" id="presetGrid"></div>
      <label class="upload-btn" for="bgUpload">📷 上传本地图片</label>
      <input id="bgUpload" type="file" accept="image/*" style="display:none">
      <div class="field">
        <label>或输入图片网址</label>
        <input id="bgUrl" type="text" placeholder="https://example.com/bg.jpg" autocomplete="off">
      </div>
      <button class="reset-btn" id="bgReset">恢复默认背景</button>
      <div class="hint">设置会自动保存</div>
    </div>
    <div class="tab-panel" id="panel-desktop">
      <div class="field"><label>图标大小</label></div>
      <div class="size-options" id="sizeOpts">
        <button data-size="44">小</button>
        <button data-size="54" class="active">中</button>
        <button data-size="66">大</button>
      </div>
      <div class="field"><label>每行图标数</label></div>
      <div class="size-options" id="colOpts">
        <button data-col="3">3</button>
        <button data-col="4" class="active">4</button>
        <button data-col="5">5</button>
      </div>
    </div>
    <div class="tab-panel" id="panel-about">
      <div class="about">
        <p><b>我的桌面</b> v1.0.1</p>
        <p>xiaoku OU 1.0</p>
      </div>
    </div>
    <div class="btns">
      <button id="settingsClose">完成</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var isPhone = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
                (window.matchMedia && window.matchMedia("(max-width:820px)").matches && "ontouchstart" in window);

  var STORE_KEY = "my_desktop_apps_v1";
  var apps = [];
  function load(){
    try{ apps = JSON.parse(localStorage.getItem(STORE_KEY)) || []; }catch(e){ apps = []; }
  }
  function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(apps)); }catch(e){} }

  function normalizeUrl(u){
    u = (u||"").trim();
    if(!u) return "";
    if(!/^https?:\/\//i.test(u)) u = "https://" + u;
    return u.replace(/\/+$/,"");
  }
  function domainOf(u){
    try{ return new URL(u).hostname.replace(/^www\./,""); }catch(e){ return u; }
  }
  function titleOf(u){
    var d = domainOf(u);
    return d ? d.split(".")[0] : "网页";
  }
  function iconSources(u){
    var d = domainOf(u);
    return [
      "https://www.google.com/s2/favicons?sz=128&domain=" + encodeURIComponent(d),
      "https://favicon.yandex.net/favicon/" + encodeURIComponent(d),
      "https://" + d + "/favicon.ico"
    ];
  }

  var grid = document.getElementById("grid");
  var searchInput = document.getElementById("searchInput");
  var searchClear = document.getElementById("searchClear");
  var searchEmpty = document.getElementById("searchEmpty");
  var searchKW = "";

  function getVisibleApps(){
    if(!searchKW) return apps;
    var kw = searchKW.toLowerCase();
    return apps.filter(function(a){
      return a.name.toLowerCase().indexOf(kw) > -1 || a.url.toLowerCase().indexOf(kw) > -1;
    });
  }

  function iconEl(app){
    var img = document.createElement("img");
    img.alt = "";
    img.referrerPolicy = "no-referrer";

    if(app.icon){
      img.src = app.icon;
      return img;
    }

    // 并行加载三级 favicon，谁先回来用谁
    var sources = iconSources(app.url);
    var loaded = false;
    sources.forEach(function(src){
      var testImg = new Image();
      testImg.onload = function(){
        if(!loaded){ loaded = true; img.src = src; }
      };
      testImg.src = src;
    });
    img.src = sources[0];

    return img;
  }

  function render(){
    grid.innerHTML = "";
    var visible = getVisibleApps();

    var addEl = document.createElement("div");
    addEl.className = "app add-app";
    addEl.innerHTML = '<div class="icon"><span>+</span></div><div class="name">添加</div>';
    addEl.addEventListener("click", openModal);
    grid.appendChild(addEl);

    if(visible.length === 0 && searchKW){
      searchEmpty.textContent = '没有找到「' + searchKW + '」相关的应用';
      searchEmpty.classList.add("show");
    } else {
      searchEmpty.classList.remove("show");
    }

    visible.forEach(function(app){
      var el = document.createElement("div");
      el.className = "app";
      el.draggable = !isPhone;
      el.dataset.id = app.id;

      var icon = document.createElement("div");
      icon.className = "icon";
      icon.appendChild(iconEl(app));
      el.appendChild(icon);

      var name = document.createElement("div");
      name.className = "name";
      name.textContent = app.name;
      el.appendChild(name);

      var del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.addEventListener("click", function(ev){
        ev.stopPropagation();
        removeApp(app.id);
      });
      el.appendChild(del);

      if(isPhone){
        el.addEventListener("click", function(){ if(!document.body.classList.contains("edit")) openApp(app); });
      } else {
        el.addEventListener("dblclick", function(){ if(!document.body.classList.contains("edit")) openApp(app); });
      }

      if(!isPhone){
        el.addEventListener("dragstart", function(ev){ this.classList.add("dragging"); ev.dataTransfer.setData("text/plain", app.id); });
        el.addEventListener("dragend", function(){ this.classList.remove("dragging"); });
        el.addEventListener("dragover", function(ev){ ev.preventDefault(); this.querySelector(".icon").classList.add("over"); });
        el.addEventListener("dragleave", function(){ this.querySelector(".icon").classList.remove("over"); });
        el.addEventListener("drop", function(ev){
          ev.preventDefault();
          this.querySelector(".icon").classList.remove("over");
          var fromId = ev.dataTransfer.getData("text/plain");
          var toId = app.id;
          moveApp(fromId, toId);
        });
      } else {
        addTouchDrag(el, app.id);
      }

      grid.appendChild(el);
    });
  }

  function openApp(app){ window.open(app.url, "_blank", "noopener"); }

  function removeApp(id){
    apps = apps.filter(function(a){ return a.id !== id; });
    save(); render();
  }

  function moveApp(fromId, toId){
    if(fromId === toId) return;
    var fromIdx = apps.findIndex(function(a){ return a.id === fromId; });
    var toIdx = apps.findIndex(function(a){ return a.id === toId; });
    if(fromIdx < 0 || toIdx < 0) return;
    var [item] = apps.splice(fromIdx, 1);
    apps.splice(toIdx, 0, item);
    save(); render();
  }

  /* ===== 长按进入编辑模式（红叉） ===== */
  var longTimer = null;

  grid.addEventListener("pointerdown", function(ev){
    var appEl = ev.target.closest && ev.target.closest(".app:not(.add-app)");
    if(!appEl) return;
    if(document.body.classList.contains("edit")) return;
    longTimer = setTimeout(function(){
      document.body.classList.add("edit");
      navigator.vibrate && navigator.vibrate(10);
    }, 550);
  });

  grid.addEventListener("pointerup", function(){ clearTimeout(longTimer); });
  grid.addEventListener("pointercancel", function(){ clearTimeout(longTimer); });
  grid.addEventListener("pointermove", function(){ clearTimeout(longTimer); });

  document.getElementById("desktop").addEventListener("pointerdown", function(ev){
    if(!ev.target.closest(".app") && !ev.target.closest("#topbar")){
      document.body.classList.remove("edit");
    }
  });

  if(!isPhone){
    grid.addEventListener("contextmenu", function(ev){
      var appEl = ev.target.closest && ev.target.closest(".app:not(.add-app)");
      if(appEl){
        ev.preventDefault();
        document.body.classList.add("edit");
      }
    });
  }

  /* ===== 搜索 ===== */
  searchInput.addEventListener("input", function(){
    searchKW = this.value.trim();
    searchClear.classList.toggle("show", searchKW.length > 0);
    render();
  });
  searchClear.addEventListener("click", function(){
    searchKW = "";
    searchInput.value = "";
    searchClear.classList.remove("show");
    render();
  });
  document.addEventListener("keydown", function(ev){
    if(ev.key === "Escape" && searchKW){
      searchKW = "";
      searchInput.value = "";
      searchClear.classList.remove("show");
      render();
    }
  });

  /* ===== 添加弹窗 ===== */
  var modal = document.getElementById("modal");
  var urlInput = document.getElementById("urlInput");
  var nameInput = document.getElementById("nameInput");
  var namePreview = document.getElementById("namePreview");
  var addOk = document.getElementById("addOk");
  var iconUpload = document.getElementById("iconUpload");
  var iconPreview = document.getElementById("iconPreview");
  var iconPreviewImg = document.getElementById("iconPreviewImg");
  var iconClear = document.getElementById("iconClear");
  var customIconData = null;

  function updateNamePreview(){
    var nm = nameInput.value.trim();
    if(nm){
      namePreview.innerHTML = '桌面显示名称：<b>' + nm + '</b>';
    } else {
      var u = normalizeUrl(urlInput.value);
      var auto = u ? titleOf(u) : "";
      namePreview.innerHTML = auto ? '自动识别为：<b>' + auto + '</b>' : '';
    }
  }

  function openModal(){ modal.classList.add("show"); setTimeout(function(){ urlInput.focus(); },100); }
  function closeModal(){
    modal.classList.remove("show");
    urlInput.value = "";
    nameInput.value = "";
    namePreview.textContent = "";
    iconUpload.value = "";
    iconPreview.classList.remove("show");
    iconClear.classList.remove("show");
    customIconData = null;
  }

  urlInput.addEventListener("input", updateNamePreview);
  nameInput.addEventListener("input", updateNamePreview);

  iconUpload.addEventListener("change", function(ev){
    var file = ev.target.files && ev.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      customIconData = e.target.result;
      iconPreviewImg.src = customIconData;
      iconPreview.classList.add("show");
      iconClear.classList.add("show");
    };
    reader.readAsDataURL(file);
  });

  iconClear.addEventListener("click", function(){
    customIconData = null;
    iconUpload.value = "";
    iconPreview.classList.remove("show");
    iconClear.classList.remove("show");
  });

  addOk.addEventListener("click", function(){
    var u = normalizeUrl(urlInput.value);
    if(!u){ alert("请填写有效的网站链接"); urlInput.focus(); return; }
    var nm = nameInput.value.trim() || titleOf(u);
    var appData = { id: Date.now().toString(36), url:u, name:nm };
    if(customIconData) appData.icon = customIconData;
    apps.push(appData);
    save(); render();
    closeModal();
  });
  document.getElementById("addCancel").addEventListener("click", closeModal);
  modal.addEventListener("click", function(ev){ if(ev.target === modal) closeModal(); });
  document.addEventListener("keydown", function(ev){ if(ev.key === "Escape") closeModal(); });

  /* ===== 手机端 Touch 拖拽排序 ===== */
  function addTouchDrag(el, id){
    var startX, startY, dragging=false, overEl=null;
    el.addEventListener("touchstart", function(ev){
      if(document.body.classList.contains("edit")) return;
      var t = ev.touches[0]; startX=t.clientX; startY=t.clientY; dragging=false;
    }, {passive:true});
    el.addEventListener("touchmove", function(ev){
      if(document.body.classList.contains("edit")) return;
      var t = ev.touches[0];
      if(!dragging && Math.hypot(t.clientX-startX, t.clientY-startY) > 8){ dragging=true; el.classList.add("dragging"); }
      if(dragging){ ev.preventDefault(); el.style.position="fixed"; el.style.zIndex=99; el.style.pointerEvents="none";
        el.style.left=(t.clientX-30)+"px"; el.style.top=(t.clientY-30)+"px";
        var target = document.elementFromPoint(t.clientX, t.clientY);
        var appEl = target && target.closest && target.closest(".app:not(.add-app)");
        if(overEl && overEl !== appEl) overEl.querySelector(".icon").classList.remove("over");
        if(appEl && appEl !== el){ appEl.querySelector(".icon").classList.add("over"); overEl = appEl; }
      }
    }, {passive:false});
    el.addEventListener("touchend", function(){
      if(dragging){
        if(overEl){ moveApp(id, overEl.dataset.id); }
        el.classList.remove("dragging"); el.style=""; dragging=false;
        if(overEl){ overEl.querySelector(".icon").classList.remove("over"); overEl=null; }
      }
    });
  }

  /* ===== 时钟 ===== */
  function tick(){
    var now = new Date();
    var hh = String(now.getHours()).padStart(2,"0");
    var mm = String(now.getMinutes()).padStart(2,"0");
    document.getElementById("clock").textContent = hh + ":" + mm;
    var wd = ["日","一","二","三","四","五","六"][now.getDay()];
    document.getElementById("date").textContent =
      (now.getMonth()+1) + "月" + now.getDate() + "日 星期" + wd;
  }
  setInterval(tick, 1000); tick();

  /* ===== 设置：背景 ===== */
  var BG_KEY = "my_desktop_bg_v1";
  var bgState = { type:"default", value:"" };
  function loadBg(){ try{ var s=JSON.parse(localStorage.getItem(BG_KEY)); if(s) bgState=s; }catch(e){} }
  function saveBg(){ try{ localStorage.setItem(BG_KEY, JSON.stringify(bgState)); }catch(e){} }

  var PRESETS = [
    "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600",
    "https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600",
    "https://images.unsplash.com/photo-1557683316-973673baf926?w=600",
    "https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=600",
    "https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=600"
  ];

  function applyBg(){
    if(bgState.type === "default"){
      document.body.style.backgroundImage = "";
      document.body.removeAttribute("data-hasbg");
    } else {
      document.body.style.backgroundImage = "url(" + bgState.value + ")";
      document.body.style.backgroundSize = "cover";
      document.body.style.backgroundPosition = "center";
      document.body.setAttribute("data-hasbg", "1");
    }
  }

  var settingsModal = document.getElementById("settingsModal");
  var settingsBtn = document.getElementById("settingsBtn");
  var settingsClose = document.getElementById("settingsClose");
  function openSettings(){ settingsModal.classList.add("show"); renderPresets(); }
  function closeSettings(){ settingsModal.classList.remove("show"); }
  settingsBtn.addEventListener("click", openSettings);
  settingsClose.addEventListener("click", closeSettings);
  settingsModal.addEventListener("click", function(ev){ if(ev.target===settingsModal) closeSettings(); });

  settingsModal.querySelectorAll(".tabs button").forEach(function(btn){
    btn.addEventListener("click", function(){
      settingsModal.querySelectorAll(".tabs button").forEach(function(b){ b.classList.toggle("active", b===btn); });
      settingsModal.querySelectorAll(".tab-panel").forEach(function(p){ p.classList.toggle("active", p.id==="panel-"+btn.dataset.tab); });
    });
  });

  var presetGrid = document.getElementById("presetGrid");
  function renderPresets(){
    presetGrid.innerHTML = "";
    PRESETS.forEach(function(url){
      var d = document.createElement("div");
      d.className = "preset" + (bgState.type==="preset" && bgState.value===url ? " active":"");
      d.style.backgroundImage = "url("+url+")";
      d.addEventListener("click", function(){
        bgState = { type:"preset", value:url };
        saveBg(); applyBg(); renderPresets();
      });
      presetGrid.appendChild(d);
    });
  }

  document.getElementById("bgUpload").addEventListener("change", function(ev){
    var file = ev.target.files && ev.target.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      bgState = { type:"upload", value:e.target.result };
      saveBg(); applyBg(); renderPresets();
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("bgUrl").addEventListener("change", function(ev){
    var v = ev.target.value.trim();
    if(!v) return;
    if(!/^https?:\/\//i.test(v)) v = "https://"+v;
    bgState = { type:"url", value:v };
    saveBg(); applyBg(); renderPresets();
  });

  document.getElementById("bgReset").addEventListener("click", function(){
    bgState = { type:"default", value:"" };
    saveBg(); applyBg(); renderPresets();
    document.getElementById("bgUrl").value = "";
  });

  /* ===== 设置：桌面 ===== */
  function applyLayout(){
    var size = bgState.size || 54;
    var cols = bgState.cols || 4;
    document.documentElement.style.setProperty("--icon", size+"px");
    grid.style.gridTemplateColumns = "repeat("+cols+", 1fr)";
  }
  document.getElementById("sizeOpts").addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if(!b) return;
    bgState.size = parseInt(b.dataset.size,10);
    saveBg(); applyLayout(); syncLayoutBtns();
  });
  document.getElementById("colOpts").addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if(!b) return;
    bgState.cols = parseInt(b.dataset.col,10);
    saveBg(); applyLayout(); syncLayoutBtns();
  });
  function syncLayoutBtns(){
    document.getElementById("sizeOpts").querySelectorAll("button").forEach(function(b){
      b.classList.toggle("active", parseInt(b.dataset.size,10)===bgState.size);
    });
    document.getElementById("colOpts").querySelectorAll("button").forEach(function(b){
      b.classList.toggle("active", parseInt(b.dataset.col,10)===bgState.cols);
    });
  }

  /* ===== 初始化 ===== */
  load();
  loadBg();
  applyBg();
  applyLayout();
  syncLayoutBtns();
  render();
})();
</script>
</body>
</html>
