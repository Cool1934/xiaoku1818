<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" type="image/x-icon" href="0c3d410f3f40eeced3e3eca7af7d8df6.ico">
<title>小酷 AI 聊天助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #fdf2f8 50%, #f0fdfa 100%);
    color: #1f2937;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .app {
    width: 100%;
    max-width: 820px;
    height: 90vh;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(14px);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(79,70,229,0.15), 0 4px 12px rgba(0,0,0,0.05);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.6);
  }
  .header {
    padding: 18px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #fff;
  }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: rgba(255,255,255,0.22);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
  }
  .header h1 { font-size: 17px; font-weight: 600; }
  .header p { font-size: 12px; opacity: 0.85; margin-top: 2px; }

  .chat { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .chat::-webkit-scrollbar { width: 6px; }
  .chat::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 3px; }

  .msg { display: flex; gap: 10px; max-width: 85%; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg .bubble {
    padding: 12px 16px; border-radius: 16px; line-height: 1.6; font-size: 14.5px;
    white-space: pre-wrap; word-break: break-word; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.user .bubble { background: linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; border-top-right-radius: 6px; }
  .msg.ai .bubble { background:#fff; color:#1f2937; border:1px solid #eef1f5; border-top-left-radius: 6px; }
  .msg .icon { width:32px; height:32px; flex:none; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .msg.user .icon { background:#eef2ff; }
  .msg.ai .icon { background:linear-gradient(135deg,#4f46e5,#7c3aed); color:#fff; }

  .typing { display:inline-flex; gap:4px; align-items:center; }
  .typing span { width:6px; height:6px; background:#9ca3af; border-radius:50%; animation: blink 1.2s infinite; }
  .typing span:nth-child(2){ animation-delay:.2s; } .typing span:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,80%,100%{opacity:.3;} 40%{opacity:1;} }

  .composer { padding: 14px 18px; background: rgba(255,255,255,0.9); border-top: 1px solid #eef1f5; }
  .row { display:flex; gap:10px; align-items:flex-end; }
  textarea {
    flex:1; resize:none; min-height:46px; max-height:140px;
    padding:12px 16px; font-size:14.5px; font-family:inherit; color:#1f2937;
    border:1px solid #e5e7eb; border-radius:14px; outline:none; transition: border .2s, box-shadow .2s;
    background:#fafbff;
  }
  textarea:focus { border-color:#7c3aed; box-shadow:0 0 0 3px rgba(124,58,237,0.15); }
  button.send {
    height:46px; padding:0 22px; border:none; border-radius:14px; cursor:pointer; font-size:15px; font-weight:600;
    color:#fff; background:linear-gradient(135deg,#4f46e5,#7c3aed);
    box-shadow:0 6px 16px rgba(79,70,229,0.3); transition: transform .15s, opacity .2s;
  }
  button.send:hover { transform: translateY(-1px); }
  button.send:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
  .hint { font-size:11.5px; color:#9ca3af; margin-top:8px; text-align:center; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="avatar">酷</div>
    <div>
      <h1>小酷 AI 聊天助手</h1>
      <p>由 glm-4-flash 驱动 · 多轮对话</p>
    </div>
  </div>
  <div class="chat" id="chat"></div>
  <div class="composer">
    <div class="row">
      <textarea id="input" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="hint">提示：企业安全在小酷ai</div>
  </div>
</div>

<script>
const API_URL = "https://open.bigmodel.cn/api/paas/v4/chat/completions";
const API_KEY = "341a2ef8f37147e093047f63a67d877f.d1PUFoy5YII2749q"; // ← 替换为你的 Key
const MODEL = "glm-4-flash";

const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");

const messages = [
  { role: "system", content: "你是一个有帮助、友善的AI助手。" }
];

function addMsg(role, text) {
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const icon = role === "user" ? "我" : "酷";
  wrap.innerHTML = `<div class="icon">${icon}</div>
    <div class="bubble">${text}</div>`;
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return wrap.querySelector(".bubble");
}

function setTyping() {
  const wrap = document.createElement("div");
  wrap.className = "msg ai";
  wrap.innerHTML = `<div class="icon">酷</div><div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>`;
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return wrap;
}

async function send() {
  const text = inputEl.value.trim();
  if (!text || sendBtn.disabled) return;
  if (API_KEY === "你的智谱AI_API_KEY") {
    alert("链接有吴");
    return;
  }
  addMsg("user", text);
  messages.push({ role: "user", content: text });
  inputEl.value = "";
  sendBtn.disabled = true;

  const loading = setTyping();
  try {
    const resp = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + API_KEY
      },
      body: JSON.stringify({ model: MODEL, messages, stream: false })
    });
    const data = await resp.json();
    loading.remove();
    const reply = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content)
      || JSON.stringify(data);
    addMsg("ai", reply);
    messages.push({ role: "assistant", content: reply });
  } catch (e) {
    loading.remove();
    addMsg("ai", "请求失败：" + e.message);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener("click", send);
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
});

// 欢迎语
addMsg("ai", "你好，我是小酷 AI 助手 🤖\n有什么我可以帮你的吗？");
</script>
</body>
</html>
